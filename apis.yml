name: Virsa Systems
description: Virsa Systems was a governance, risk, and compliance (GRC) software company founded
  in 1996 that specialized in helping enterprises meet regulatory requirements such as Sarbanes-Oxley
  by embedding automated control design, testing, and enforcement directly into their business
  processes, notably around SAP access controls and segregation-of-duties. Lightspeed Venture
  Partners invested in the company at an early stage in 2004, and Virsa Systems was acquired by SAP
  in 2006, becoming the foundation of what is now SAP GRC / SAP Access Control. It no longer operates
  as an independent company and maintains no separate website, developer portal, or public API. This
  profile is retained in the API Evangelist network as a historical/portfolio record; there is no
  active API surface to enrich.
